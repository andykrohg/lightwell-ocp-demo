---
# PostgreSQL for TPA — simple StatefulSet (fine for demos, not HA)
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-credentials
  labels:
    app.kubernetes.io/part-of: tpa
type: Opaque
stringData:
  db-host: postgresql.NAMESPACE.svc.cluster.local
  db-port: "5432"
  db-name: trustify
  db-username: trustify
  db-password: trustify-demo-password
---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-admin-credentials
  labels:
    app.kubernetes.io/part-of: tpa
type: Opaque
stringData:
  db-username: postgres
  db-password: postgres-admin-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  labels:
    app.kubernetes.io/part-of: tpa
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/part-of: tpa
    app.kubernetes.io/component: database
spec:
  serviceName: postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-15:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              value: trustify
            - name: POSTGRESQL_PASSWORD
              value: trustify-demo-password
            - name: POSTGRESQL_DATABASE
              value: trustify
            - name: POSTGRESQL_ADMIN_PASSWORD
              value: postgres-admin-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["psql", "-U", "trustify", "-d", "trustify", "-c", "SELECT 1"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgresql-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/part-of: tpa
    app.kubernetes.io/component: database
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgresql
---
# MinIO for S3-compatible storage (fine for demos)
apiVersion: v1
kind: Secret
metadata:
  name: storage-credentials
  labels:
    app.kubernetes.io/part-of: tpa
type: Opaque
stringData:
  aws-access-key-id: minioadmin
  aws-secret-access-key: minioadmin-demo-password
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  labels:
    app.kubernetes.io/part-of: tpa
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/part-of: tpa
    app.kubernetes.io/component: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin-demo-password
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/part-of: tpa
    app.kubernetes.io/component: storage
spec:
  ports:
    - port: 9000
      targetPort: 9000
      name: api
    - port: 9001
      targetPort: 9001
      name: console
  selector:
    app: minio
---
# Keycloak for OIDC (TPA requires it, no way around it)
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm-import
  labels:
    app.kubernetes.io/part-of: tpa
    app.kubernetes.io/component: oidc
data:
  trustify-realm.json: REALM_JSON_PLACEHOLDER
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/part-of: tpa
    app.kubernetes.io/component: oidc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm-import
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/part-of: tpa
    app.kubernetes.io/component: oidc
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: keycloak
