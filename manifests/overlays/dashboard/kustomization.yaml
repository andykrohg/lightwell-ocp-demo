apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/dashboard

images:
  - name: IMAGE_PLACEHOLDER
    newName: quay.io/andy_krohg/lightwell-demo-hub
    newTag: latest

configMapGenerator:
  - name: demo-hub-config
    literals:
      - TPA_CONSOLE_URL=__TPA_CONSOLE_URL__
      - ACS_CONSOLE_URL=__ACS_CONSOLE_URL__
      - OCP_CONSOLE_URL=__OCP_CONSOLE_URL__
      - DEMO_NAMESPACE=__DEMO_NAMESPACE__
