apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/dashboard

images:
  - name: IMAGE_PLACEHOLDER
    newName: quay.io/andy_krohg/lightwell-demo-hub
    newTag: latest

configMapGenerator:
  - name: demo-hub-config
    literals:
      - TPA_CONSOLE_URL=https://tpa.apps.example.com
      - ACS_CONSOLE_URL=https://central-acs.apps.example.com
      - OCP_CONSOLE_URL=https://console-openshift-console.apps.example.com
      - DEMO_NAMESPACE=lightwell-demo
