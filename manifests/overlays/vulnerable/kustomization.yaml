apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namePrefix: vulnerable-

resources:
  - ../../base/catalog-app

commonLabels:
  app.demo/variant: vulnerable

images:
  - name: IMAGE_PLACEHOLDER
    newName: __REGISTRY_HOST__/catalog-app
    newTag: vulnerable-latest

configMapGenerator:
  - name: catalog-app-config
    literals:
      - SPRING_PROFILES_ACTIVE=vulnerable
