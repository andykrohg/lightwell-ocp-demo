apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: secure-catalog-pipeline
  labels:
    app.kubernetes.io/part-of: lightwell-demo
spec:
  description: >
    Builds, signs, scans, and deploys the catalog-app. Parameterized to run
    with either the vulnerable (Maven Central) or remediated (Lightwell Network)
    dependency profile.
  params:
    - name: GIT_REPO
      type: string
      description: Git repository URL
    - name: GIT_REVISION
      type: string
      default: main
      description: Git revision (branch, tag, or commit SHA)
    - name: MAVEN_PROFILE
      type: string
      default: vulnerable
      description: Maven profile to activate (vulnerable or remediated)
    - name: IMAGE_NAME
      type: string
      description: Target container image name (e.g. image-registry.openshift-image-registry.svc:5000/lightwell-demo/catalog-app)
    - name: IMAGE_TAG
      type: string
      default: latest
      description: Container image tag
    - name: NAMESPACE
      type: string
      default: lightwell-demo
      description: Target OpenShift namespace for deployment
    - name: TPA_URL
      type: string
      description: Trusted Profile Analyzer base URL
    - name: TPA_OIDC_ISSUER_URL
      type: string
      description: OIDC token endpoint for TPA authentication
    - name: TPA_CLIENT_ID
      type: string
      default: walker
      description: OIDC client ID for TPA
    - name: TPA_CLIENT_SECRET
      type: string
      description: OIDC client secret for TPA
    - name: ROX_CENTRAL_ENDPOINT
      type: string
      description: ACS Central endpoint (host:port)
    - name: ROX_API_TOKEN
      type: string
      description: ACS API token
    - name: SOFT_FAIL
      type: string
      default: "false"
      description: When true, ACS policy violations do not block the pipeline
  workspaces:
    - name: shared-workspace
      description: Workspace shared across pipeline tasks
    - name: maven-settings
      description: Optional workspace for Maven settings.xml (public demo repo needs no credentials)

  tasks:
    # 1. Clone source code
    - name: git-clone
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.GIT_REPO)
        - name: revision
          value: $(params.GIT_REVISION)
        - name: subdirectory
          value: ""
        - name: deleteExisting
          value: "true"
      workspaces:
        - name: output
          workspace: shared-workspace

    # 2. Build with Maven
    - name: maven-build
      runAfter:
        - git-clone
      taskRef:
        name: maven
      params:
        - name: MAVEN_IMAGE
          value: maven:3.9-eclipse-temurin-17
        - name: GOALS
          value:
            - -P$(params.MAVEN_PROFILE)
            - clean
            - package
            - -DskipTests
            - -B
        - name: CONTEXT_DIR
          value: catalog-app
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: maven-settings
          workspace: maven-settings

    # 3. Upload SBOM to TPA (before buildah to avoid SELinux conflict on shared PVC)
    - name: upload-sbom
      runAfter:
        - maven-build
      taskRef:
        name: upload-sbom-to-tpa
      params:
        - name: TPA_URL
          value: $(params.TPA_URL)
        - name: SBOM_PATH
          value: catalog-app/target/bom.json
        - name: SBOM_ID
          value: catalog-app-$(params.MAVEN_PROFILE)-$(params.IMAGE_TAG)
        - name: OIDC_ISSUER_URL
          value: $(params.TPA_OIDC_ISSUER_URL)
        - name: TPA_CLIENT_ID
          value: $(params.TPA_CLIENT_ID)
        - name: TPA_CLIENT_SECRET
          value: $(params.TPA_CLIENT_SECRET)
      workspaces:
        - name: source
          workspace: shared-workspace

    # 4. Build container image (after SBOM upload)
    - name: buildah
      runAfter:
        - upload-sbom
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.IMAGE_NAME):$(params.IMAGE_TAG)
        - name: DOCKERFILE
          value: catalog-app/Containerfile.pipeline
        - name: CONTEXT
          value: catalog-app
        - name: TLSVERIFY
          value: "false"
      workspaces:
        - name: source
          workspace: shared-workspace

    # 5. Sign container image
    - name: cosign-sign
      runAfter:
        - buildah
      taskRef:
        name: cosign-sign-image
      params:
        - name: IMAGE
          value: $(params.IMAGE_NAME):$(params.IMAGE_TAG)

    # 6. ACS policy check
    - name: acs-image-check
      runAfter:
        - buildah
      taskRef:
        name: acs-image-check
      params:
        - name: ROX_CENTRAL_ENDPOINT
          value: $(params.ROX_CENTRAL_ENDPOINT)
        - name: ROX_API_TOKEN
          value: $(params.ROX_API_TOKEN)
        - name: IMAGE
          value: $(params.IMAGE_NAME):$(params.IMAGE_TAG)
        - name: SOFT_FAIL
          value: $(params.SOFT_FAIL)

    # 7. ACS vulnerability scan
    - name: acs-image-scan
      runAfter:
        - buildah
      taskRef:
        name: acs-image-scan
      params:
        - name: ROX_CENTRAL_ENDPOINT
          value: $(params.ROX_CENTRAL_ENDPOINT)
        - name: ROX_API_TOKEN
          value: $(params.ROX_API_TOKEN)
        - name: IMAGE
          value: $(params.IMAGE_NAME):$(params.IMAGE_TAG)

    # 8. Deploy to OpenShift
    - name: deploy
      runAfter:
        - cosign-sign
        - acs-image-check
        - acs-image-scan
      taskSpec:
        params:
          - name: NAMESPACE
            type: string
          - name: MAVEN_PROFILE
            type: string
          - name: IMAGE_NAME
            type: string
          - name: IMAGE_TAG
            type: string
        steps:
          - name: deploy
            image: registry.redhat.io/openshift4/ose-cli:latest
            script: |
              #!/usr/bin/env bash
              set -euo pipefail

              IMAGE="$(params.IMAGE_NAME):$(params.IMAGE_TAG)"
              echo "=== Deploying catalog-app ($(params.MAVEN_PROFILE)) ==="
              echo "Namespace: $(params.NAMESPACE)"
              echo "Image: ${IMAGE}"

              cd $(workspaces.source.path)

              REGISTRY_HOST=$(echo "$(params.IMAGE_NAME)" | cut -d/ -f1)
              oc kustomize manifests/overlays/$(params.MAVEN_PROFILE)/ \
                | sed "s|__REGISTRY_HOST__|${REGISTRY_HOST}|g" \
                | oc apply -n $(params.NAMESPACE) -f -

              oc set image deployment/$(params.MAVEN_PROFILE)-catalog-app \
                catalog-app="${IMAGE}" \
                -n $(params.NAMESPACE)

              oc rollout status deployment/$(params.MAVEN_PROFILE)-catalog-app \
                -n $(params.NAMESPACE) --timeout=120s

              echo "Deployment complete."
        workspaces:
          - name: source
      params:
        - name: NAMESPACE
          value: $(params.NAMESPACE)
        - name: MAVEN_PROFILE
          value: $(params.MAVEN_PROFILE)
        - name: IMAGE_NAME
          value: $(params.IMAGE_NAME)
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
      workspaces:
        - name: source
          workspace: shared-workspace
