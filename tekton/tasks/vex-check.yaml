apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: vex-check
  labels:
    app.kubernetes.io/part-of: lightwell-demo
spec:
  description: >
    Scans an SBOM for known vulnerabilities and applies VEX (Vulnerability
    Exploitability eXchange) data to identify which findings have been resolved
    by the dependency supplier. Outputs a summary of remaining vs suppressed CVEs.
  params:
    - name: SBOM_PATH
      type: string
      default: target/bom.json
      description: Path to the CycloneDX SBOM relative to workspace root
    - name: VEX_PATH
      type: string
      default: ""
      description: Path to the OpenVEX document relative to workspace root (empty to skip VEX)
    - name: FAIL_ON
      type: string
      default: ""
      description: Fail if vulnerabilities at this severity or higher remain (critical, high, medium, low)
  workspaces:
    - name: source
      description: Workspace containing the SBOM and VEX files
  results:
    - name: TOTAL_VULNS
      description: Total vulnerabilities found before VEX
    - name: SUPPRESSED
      description: Number of vulnerabilities suppressed by VEX
    - name: REMAINING
      description: Number of vulnerabilities remaining after VEX
    - name: STATUS
      description: Overall check status (pass or fail)
  steps:
    - name: scan
      image: registry.access.redhat.com/ubi9/ubi:latest
      script: |
        #!/usr/bin/env bash
        set -eu

        echo "=== Installing scanner ==="
        curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /tmp/bin 2>&1
        export PATH="/tmp/bin:$PATH"

        SBOM_FILE="$(workspaces.source.path)/$(params.SBOM_PATH)"
        VEX_FILE=""
        if [ -n "$(params.VEX_PATH)" ]; then
          VEX_FILE="$(workspaces.source.path)/$(params.VEX_PATH)"
        fi

        if [ ! -f "$SBOM_FILE" ]; then
          echo "ERROR: SBOM not found at $SBOM_FILE"
          printf "failure" > "$(results.STATUS.path)"
          exit 1
        fi

        echo ""
        echo "=== Vulnerability Check ==="
        echo ""

        FAIL_ON="$(params.FAIL_ON)"

        BASELINE_COUNT=$(grype sbom:"${SBOM_FILE}" -o json 2>/dev/null \
          | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('matches',[])))")
        printf "%s" "$BASELINE_COUNT" > "$(results.TOTAL_VULNS.path)"

        GRYPE_ARGS="sbom:${SBOM_FILE} -o table"

        if [ -n "$VEX_FILE" ] && [ -f "$VEX_FILE" ]; then
          echo "Applying VEX data from $(params.VEX_PATH)"
          echo ""
          GRYPE_ARGS="${GRYPE_ARGS} --vex ${VEX_FILE}"

          REMAINING_COUNT=$(grype sbom:"${SBOM_FILE}" --vex "${VEX_FILE}" -o json 2>/dev/null \
            | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('matches',[])))")
          SUPPRESSED=$((BASELINE_COUNT - REMAINING_COUNT))
          if [ $SUPPRESSED -lt 0 ]; then SUPPRESSED=0; fi

          printf "%s" "$SUPPRESSED" > "$(results.SUPPRESSED.path)"
          printf "%s" "$REMAINING_COUNT" > "$(results.REMAINING.path)"
        else
          echo "No VEX data provided — showing raw scan results"
          echo ""
          printf "0" > "$(results.SUPPRESSED.path)"
          printf "%s" "$BASELINE_COUNT" > "$(results.REMAINING.path)"
        fi

        if [ -n "$FAIL_ON" ]; then
          GRYPE_ARGS="${GRYPE_ARGS} --fail-on ${FAIL_ON}"
        fi

        echo ""
        if grype $GRYPE_ARGS 2>/dev/null; then
          printf "pass" > "$(results.STATUS.path)"
        else
          EXIT_CODE=$?
          if [ -n "$FAIL_ON" ] && [ $EXIT_CODE -eq 2 ]; then
            printf "fail" > "$(results.STATUS.path)"
            echo ""
            echo "FAILED: Vulnerabilities at severity '$FAIL_ON' or higher remain."
            exit 1
          fi
          printf "pass" > "$(results.STATUS.path)"
        fi

        echo ""
        echo "=== Summary ==="
        echo "  Total vulnerabilities: $(cat $(results.TOTAL_VULNS.path))"
        echo "  Suppressed by VEX:     $(cat $(results.SUPPRESSED.path))"
        echo "  Remaining:             $(cat $(results.REMAINING.path))"
